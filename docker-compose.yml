services:
  backend:
    build:
      context: ./portal-expernet
      target: dev
    container_name: portal-expernet-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
    volumes:
      - ./portal-expernet:/app
      - /app/node_modules
    networks:
      - app-network

  frontend:
    build:
      context: ./front
      target: dev
    container_name: portal-expernet-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:3000
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

